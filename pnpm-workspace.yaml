# pnpm config (pnpm 11 reads overrides/build allowances from here,
# NOT from package.json — npm `overrides` and `pnpm.onlyBuiltDependencies`
# there are silently ignored).
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  # Git dep needs its prepare build; pnpm demands the exact resolved URL.
  # If the @fleet/ai-forms pin moves, update this sha (pnpm prints the new
  # key in its ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED message).
  'ai-forms@https://codeload.github.com/bitbaum/ai-forms/tar.gz/52e3239ae4b0a2fcdc579edc2b9d8f8e7bff44b9': true
  # Same shape for limitkit (github:bitbaum/limitkit#v0.2.0): dist is built by
  # its prepare script, and pnpm keys the allowance by the resolved tarball.
  'limitkit@https://codeload.github.com/bitbaum/limitkit/tar.gz/75adef1e993f90c6079a36a6cd96567cae5924c7': true
  esbuild: true
  puppeteer: true
  unrs-resolver: true
# Pinned to exact versions on purpose. A BARE package name here exempts every
# FUTURE version of that package too — including one published by whoever takes
# the publishing account next — so the age gate quietly stops protecting the
# two packages most likely to be installed the minute they are released.
# Naming the version makes each new release a deliberate line in a diff, which
# is the entire point of the delay.
minimumReleaseAgeExclude:
  - '@bitbaum/chatkit'
  - '@bitbaum/ai-kit'
  - '@bitbaum/mail-kit@0.1.1'
  - bip-kit@0.2.6 || 0.2.7 || 0.3.1
  - '@bitbaum/accountkit@0.9.0 || 0.9.1 || 0.10.0 || 0.11.0 || 0.12.0 || 0.13.0 || 0.14.0'
  - '@bitbaum/searchkit@0.2.3'
  - '@bitbaum/whenkit@0.3.3'
  - limitkit@0.2.1
  - '@bitbaum/chartkit@0.6.0 || 0.7.0'
overrides:
  '@swc/helpers': 0.5.23
  '@opentelemetry/core': ^2.8.0
  fast-xml-parser: ^5.3.6
  ajv: ^6.14.0
  minimatch: ^10.2.1
  nodemailer: ^10.2.1
  js-yaml: ^4.3.2
  basic-ftp: '>=5.3.0'
  postcss: ^8.5.26
  esbuild: 0.28.1
  # GHSA-pqg4-j6r4-53mv: first patched release is 1.11.0 (dev only, via
  # concurrently and npm-run-all).
  shell-quote: ^1.11.0
  # vite reaches the tree through vitest and @vitejs/plugin-react (dev only).
  vite: ^8.2.4
  brace-expansion: ^5.0.9
  uuid: $uuid
  sharp: $sharp
  # Security floors for transitive diagram/rendering dependencies.
  dompurify: ^3.4.17
  lodash-es: ^4.18.1
  katex: ^0.19.1
