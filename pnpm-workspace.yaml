# pnpm config (pnpm 11 reads overrides/build allowances from here,
# NOT from package.json — npm `overrides` and `pnpm.onlyBuiltDependencies`
# there are silently ignored).
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  # Git dep needs its prepare build; pnpm demands the exact resolved URL.
  # If the @fleet/ai-forms pin moves, update this sha (pnpm prints the new
  # key in its ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED message).
  'ai-forms@https://codeload.github.com/bitbaum/ai-forms/tar.gz/52e3239ae4b0a2fcdc579edc2b9d8f8e7bff44b9': true
  esbuild: true
  puppeteer: true
  unrs-resolver: true
# Pinned to exact versions on purpose. A BARE package name here exempts every
# FUTURE version of that package too — including one published by whoever takes
# the publishing account next — so the age gate quietly stops protecting the
# two packages most likely to be installed the minute they are released.
# Naming the version makes each new release a deliberate line in a diff, which
# is the entire point of the delay.
minimumReleaseAgeExclude:
  - '@bitbaum/ai-kit@0.13.0'
  - '@bitbaum/mail-kit@0.1.1'
  # Two versions on purpose, and this is the shape a bump has to take here.
  # The age-gate verifies the lockfile as it stands BEFORE resolution, so the
  # version being REPLACED must still be exempt for the very install that
  # replaces it. Moving this to a bare 'bip-kit@0.2.7' un-exempts 0.2.6, which
  # is still in the lockfile at that moment, and the install dies with
  # ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION naming the OLD version — which reads
  # like the new release is at fault. Same shape as the @bitbaum/ai-kit line.
  # The 0.2.6 half is inert once the lockfile no longer mentions it and can be
  # dropped by whoever next bumps this package (add THEIR outgoing version).
  # (The 0.2.4 half was dropped by the 0.2.7 bump for exactly that reason.)
  - 'bip-kit@0.2.6 || 0.2.7'
overrides:
  '@swc/helpers': 0.5.23
  '@opentelemetry/core': ^2.8.0
  fast-xml-parser: ^5.3.6
  ajv: ^6.14.0
  minimatch: ^10.2.1
  nodemailer: ^9.0.1
  js-yaml: ^4.3.1
  basic-ftp: '>=5.3.0'
  postcss: ^8.5.26
  esbuild: 0.28.1
  shell-quote: 1.10.0
  brace-expansion: ^5.0.9
  uuid: $uuid
  sharp: $sharp
